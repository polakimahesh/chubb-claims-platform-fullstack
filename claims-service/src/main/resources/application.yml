server:
  port: 8081

spring:
  application:
    name: claims-service
  datasource:
    # Defaults to in-memory H2 so the service runs with no setup; docker-compose overrides these with PostgreSQL.
    url: ${DB_URL:jdbc:h2:mem:claims;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none   # schema is owned by Flyway (src/main/resources/db/migration)
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true

claims:
  outbox:
    enabled: true
    poll-interval-ms: 1000

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  ai:
    # The AI assistant calls a language model. Without a key the endpoint answers 503; everything else works as before.
    gemini:
      # Google AI Studio key (aistudio.google.com). For local use paste it after the colon below, e.g.
      # api-key: ${GEMINI_API_KEY:AIza...}, or set GEMINI_API_KEY. NEVER commit a real key.
      api-key: ${GEMINI_API_KEY:}   # TEMPORARY demo key: delete before committing
      model: ${GEMINI_MODEL:gemini-flash-lite-latest}   # model names change: GET /v1beta/models lists what your key can use
    max-turns: 8           # model calls per chat
    max-seconds: 90          # wall-clock limit per chat
    max-concurrent: 8        # chats running at once; each holds a request thread and spends money
    timeout-seconds: 30      # per model call
  documents:
    dir: ${DOCUMENTS_DIR:${java.io.tmpdir}/claims-documents}   # local filesystem store; swap DocumentStorage for S3/Blob
  security:
    # Demo users for local development and assessment only (no real credentials). Every user shares demo-password.
    demo-password: Test@123
    users:
      - { username: tan@example.com, password: "${app.security.demo-password}", role: CLAIMANT }
      - { username: lee@example.com, password: "${app.security.demo-password}", role: CLAIMANT }
      - { username: officer-1, password: "${app.security.demo-password}", role: OFFICER }
      - { username: officer-2, password: "${app.security.demo-password}", role: OFFICER }
      - { username: manager-1, password: "${app.security.demo-password}", role: MANAGER }
